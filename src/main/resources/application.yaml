spring:
  application:
    name: sms-gateway

  datasource:
    url: jdbc:h2:file:./data/sms-gateway
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: localhost
    port: 5672
    username: hubsms
    password: hubsms123

    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1

sms:
  modem:
    port: COM5
    baud-rate: 115200