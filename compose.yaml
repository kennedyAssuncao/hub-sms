services:

  rabbitmq:
    image: rabbitmq:4-management

    container_name: hub-sms-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: hubsms
      RABBITMQ_DEFAULT_PASS: hubsms123

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data: